services:
  keycloak:
    image: ${DOCKER_REGISTRY:-docker.io}/keycloak/keycloak:latest
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"

      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8443
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: false

      KC_HTTPS_CERTIFICATE_FILE: /etc/x509/https/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/x509/https/keycloak.key
    ports:
      - "8443:8443"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./certs/fluxnova-local.crt:/etc/x509/https/keycloak.crt:ro
      - ./certs/fluxnova-local.key:/etc/x509/https/keycloak.key:ro

  bpm-platform:
    image: ${DOCKER_REGISTRY:-docker.io}/finos/fluxnova-bpm-platform:latest-corretto21-alpine
    pull_policy: if_not_present
    depends_on:
      - keycloak
    environment:
      FLUXNOVA_BPM_AUTH_ENABLED: "true"
      FLUXNOVA_BPM_AUTH_TYPE: jwt
      FLUXNOVA_BPM_JWT_JWKS_URL: "https://keycloak:8443/realms/fluxnova/protocol/openid-connect/certs"
      FLUXNOVA_BPM_JWT_ISSUER: "https://localhost:8443/realms/fluxnova"
      FLUXNOVA_BPM_JWT_AUDIENCE: "fluxnova-control-center-private-jwt"
      FLUXNOVA_BPM_JWT_HEADER_NAME: "x-fxn-identity-token"
      FLUXNOVA_BPM_JWT_HEADER_PREFIX: ""
      FLUXNOVA_BPM_JWT_USER_CLAIM_NAME: "preferred_username"
      FLUXNOVA_BPM_JWT_GROUPS_CLAIM_NAME: "groups"
    volumes:
      - ./certs/fluxnova-local.crt:/fluxnova/certs/fluxnova-local.crt:ro
    ports:
      - "8080:8080"

